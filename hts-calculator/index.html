<html lang="zh-CN">

<meta charset="UTF-8">

<title>美国进口关税计算器 | HTS Duty Calculator</title>

<style>
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}

<body class="bg-slate-50 min-h-screen">
<div class="max-w-3xl mx-auto px-4 py-8">
  <div class="text-center mb-8">
    <h1 class="text-2xl font-bold text-slate-800">🇺🇸 美国进口关税计算器</h1>
    <p class="text-sm text-slate-500 mt-1">输入 HTS 编码和货值，自动计算总关税（301 · IEEPA · 232 · MPF · HMF）</p>
    <p id="dataStatus" class="text-xs text-slate-400 mt-1">数据加载中…</p>
  </div>
  <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-4">
    <div class="mb-4 relative">
      <label class="block text-sm font-medium text-slate-700 mb-1.5">HTS 编码 <span class="text-red-500">*</span></label>
      <input id="htsInput" type="text" placeholder="输入 HTS 编码搜索，如 9405.40" autocomplete="off" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm" />
      <div id="autocomplete" class="hidden absolute z-10 w-full bg-white border border-slate-200 rounded-lg shadow-lg mt-1 max-h-64 overflow-y-auto"></div>
      <p id="htsDesc" class="text-xs text-slate-400 mt-1 hidden"></p>
    </div>
    <div id="cnHint" class="hidden bg-amber-50 border border-amber-200 rounded-lg p-3 mb-3 text-sm">🇨🇳 <span class="text-amber-700">中国编码</span> <span id="cnHintCode" class="font-mono text-amber-800 font-semibold"></span> <span class="text-amber-600">→ 🇺🇸 美国对应编码：</span><span id="cnHintUS" class="font-mono text-amber-800 font-semibold"></span><br><span id="cnHintDesc" class="text-xs text-amber-600 mt-1"></span></div>
    <div class="grid grid-cols-2 gap-4 mb-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">申报货值 (USD) <span class="text-red-500">*</span></label>
        <input id="valueInput" type="number" step="0.01" min="0" placeholder="如 5000" class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">运输方式</label>
        <div class="flex rounded-lg border border-slate-300 overflow-hidden">
          <button id="modeOcean" onclick="setMode('ocean')" class="flex-1 py-3 text-sm font-medium bg-blue-600 text-white">🚢 海运</button>
          <button id="modeAir" onclick="setMode('air')" class="flex-1 py-3 text-sm font-medium bg-white text-slate-600 hover:bg-slate-50">✈️ 空运</button>
        </div>
      </div>
    </div>
    <button id="calcBtn" onclick="calculate()" class="w-full py-3 bg-blue-600 text-white rounded-lg font-medium text-sm hover:bg-blue-700 transition">计算关税</button>
  </div>
  <div id="results" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-6">
    <h2 class="text-lg font-semibold text-slate-800 mb-4">📊 关税明细</h2>
    <div class="space-y-3">
      <div class="flex justify-between items-center py-2 border-b border-slate-100"><span class="text-sm text-slate-600">HTS 编码</span><span class="text-sm font-mono font-medium text-slate-800" id="r_hts">-</span></div>
      <div class="flex justify-between items-center py-2 border-b border-slate-100"><span class="text-sm text-slate-600">商品描述</span><span class="text-sm text-slate-800 text-right max-w-xs" id="r_desc">-</span></div>
      <div class="flex justify-between items-center py-2 border-b border-slate-100"><span class="text-sm text-slate-600">申报货值</span><span class="text-sm font-medium text-slate-800" id="r_value">-</span></div>
      <div class="border-t-2 border-slate-200 my-3"></div>
      <div class="flex justify-between items-center py-2 border-b border-slate-100"><span class="text-sm text-slate-600">基础关税</span><span class="text-sm font-medium" id="r_base">-</span></div>
      <div class="flex justify-between items-center py-2 border-b border-slate-100" id="row_301"><span class="text-sm text-slate-600">301 对华附加关税</span><span class="text-sm font-medium text-orange-600" id="r_301">-</span></div>
      <div class="flex justify-between items-center py-2 border-b border-slate-100" id="row_ieepa"><span class="text-sm text-slate-600">IEEPA 对华附加关税 <span class="text-xs text-slate-400">(9903.01.24 · 10%)</span></span><span class="text-sm font-medium text-orange-600" id="r_ieepa">-</span></div>
      <div class="flex justify-between items-center py-2 border-b border-slate-100"><span class="text-sm text-slate-600">MPF <span class="text-xs text-slate-400">(处理费 0.3464%)</span></span><span class="text-sm font-medium text-slate-700" id="r_mpf">-</span></div>
      <div class="flex justify-between items-center py-2 border-b border-slate-100" id="row_hmf"><span class="text-sm text-slate-600">HMF <span class="text-xs text-slate-400">(港口费 0.125%)</span></span><span class="text-sm font-medium text-slate-700" id="r_hmf">-</span></div>
      <div class="flex justify-between items-center py-3 bg-blue-50 -mx-2 px-4 rounded-lg mt-3"><span class="text-base font-semibold text-blue-900">总关税</span><span class="text-xl font-bold text-blue-700" id="r_total">-</span></div>
      <div class="flex justify-between items-center pt-2"><span class="text-sm text-slate-600">综合税率</span><span class="text-sm font-semibold text-slate-800" id="r_effective">-</span></div>
    </div>
    <p class="text-xs text-slate-400 mt-4 pt-3 border-t border-slate-100">⚠️ 仅供参考。实际关税以 CBP 核定为准。从量税商品请人工确认。</p>
  </div>
  <div id="message" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-lg p-4 text-sm mt-4"></div>
</div>

// === Globals ===
let D = null, currentMode = 'ocean', searchTimeout = null;

// === Init ===
async function init() {
  // Try localStorage first
  const cached = localStorage.getItem('hts_data_v1');
  if (cached) {
    try { D = JSON.parse(cached); updateStatus(); return; } catch(e) {}
  }
  // Decompress from embedded data
  try {
    const bin = Uint8Array.from(atob(DATA_B64), c => c.charCodeAt(0));
    const ds = new DecompressionStream('gzip');
    const w = ds.writable.getWriter();
    w.write(bin); w.close();
    const chunks = [];
    const r = ds.readable.getReader();
    while (true) {
      const {done, value} = await r.read();
      if (done) break;
      chunks.push(value);
    }
    let total = 0; for (const c of chunks) total += c.length;
    const merged = new Uint8Array(total);
    let offset = 0;
    for (const c of chunks) { merged.set(c, offset); offset += c.length; }
    D = JSON.parse(new TextDecoder().decode(merged));
    localStorage.setItem('hts_data_v1', JSON.stringify(D));
    updateStatus();
  } catch(e) {
    document.getElementById('dataStatus').textContent = '⚠️ 数据加载失败，请刷新重试';
    console.error(e);
  }
}

function updateStatus() {
  if (D) document.getElementById('dataStatus').textContent = '✅ 已加载 ' + Object.keys(D.hs).length.toLocaleString() + ' 条 HTS 编码';
}

// === Search ===
function search(q) {
  q = q.replace(/[^0-9.]/g, '');
  let out = [];
  const hs = D.hs;
  if (hs[q]) out.push([q, hs[q].d, hs[q].r, hs[q].t]);
  for (const c in hs) {
    if (c !== q && c.startsWith(q)) { out.push([c, hs[c].d, hs[c].r, hs[c].t]); if (out.length >= 20) break; }
  }
  return out.slice(0, 20).map(x => ({c:x[0], d:x[1], r:x[2], t:x[3]}));
}

function lookup(q, raw) {
  q = q.replace(/[^0-9.]/g, '');
  const isCN = raw && raw.length >= 8 && raw.indexOf('.') === -1;
  if (D.hs[q]) return [q, D.hs[q], isCN && !raw.includes('.') ? raw : null];
  let s = q, cnFlag = isCN ? raw : null;
  while (s.length > 4) {
    s = s.replace(/\.?0*$/, '');
    if (s === q) break;
    if (D.hs[s]) return [s, D.hs[s], cnFlag];
    q = s;
  }
  for (const c in D.hs) { if (c.startsWith(q)) return [c, D.hs[c], cnFlag]; }
  return [null, null, null];
}

function pct(v) {
  if (typeof v === 'number') return v;
  const m = String(v).match(/^(\d+\.?\d*)\s*%$/);
  return m ? parseFloat(m[1]) : null;
}

function calc(code, entry, value, mode) {
  const rt = entry.t, rv = entry.r;
  let base = 0, bp = null;
  if (rt === 'percent') { bp = pct(rv); if (bp !== null) base = value * (bp / 100); }
  let s3d = 0, s3r = null, appliedS3 = null;
  const s3list = D.m3[code];
  if (s3list && bp !== null) {
    for (const sc of s3list) { const ar = D.s3[sc]; if (ar !== undefined && ar > 0) s3r = Math.max(s3r || 0, ar); }
    if (s3r) { s3d = value * (s3r / 100); appliedS3 = sc; }
  }
  let mpf = value * 0.003464;
  if (value > 2500) mpf = Math.max(27.75, Math.min(538.40, mpf)); else mpf = 0;
  let hmf = mode === 'ocean' ? value * 0.00125 : 0;
  let ieepa = value * 0.10;
  return { code, desc: entry.d, value, mode,
    base_duty: Math.round(base * 100) / 100,
    base_rate_type: rt,
    base_rate: rt === 'percent' ? (bp || 0) : String(rv),
    s301_duty: Math.round(s3d * 100) / 100, s301_code: appliedS3 || null,
    s301_rate: s3r,
    ieepa_duty: Math.round(ieepa * 100) / 100,
    mpf: Math.round(mpf * 100) / 100,
    hmf: Math.round(hmf * 100) / 100,
    total: Math.round((base + s3d + ieepa + mpf + hmf) * 100) / 100
  };
}

// === UI ===
function setMode(m) {
  currentMode = m;
  document.getElementById('modeOcean').className = m === 'ocean' ? 'flex-1 py-3 text-sm font-medium bg-blue-600 text-white' : 'flex-1 py-3 text-sm font-medium bg-white text-slate-600 hover:bg-slate-50';
  document.getElementById('modeAir').className = m === 'air' ? 'flex-1 py-3 text-sm font-medium bg-blue-600 text-white' : 'flex-1 py-3 text-sm font-medium bg-white text-slate-600 hover:bg-slate-50';
}

document.getElementById('htsInput').addEventListener('input', function() {
  if (!D) return;
  clearTimeout(searchTimeout);
  const q = this.value.trim();
  if (q.length < 2) { document.getElementById('autocomplete').classList.add('hidden'); return; }
  searchTimeout = setTimeout(() => searchHts(q), 200);
});

document.getElementById('htsInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { document.getElementById('autocomplete').classList.add('hidden'); calculate(); }
});

document.addEventListener('click', function(e) {
  if (!e.target.closest('#htsInput') && !e.target.closest('#autocomplete')) document.getElementById('autocomplete').classList.add('hidden');
});

function searchHts(q) {
  const data = search(q);
  const ac = document.getElementById('autocomplete');
  if (!data || data.length === 0) { ac.classList.add('hidden'); return; }
  ac.innerHTML = data.map(item => `<div class="autocomplete-item px-4 py-2.5 cursor-pointer border-b border-slate-50 last:border-0 flex justify-between items-center" onclick="selectHts('${item.c}','${item.d.replace(/'/g, "\\'")}')"><span class="text-sm font-mono text-blue-700">${item.c}</span><span class="text-xs text-slate-500 ml-3 truncate max-w-[60%]">${item.d}</span></div>`).join('');
  ac.classList.remove('hidden');
}

function selectHts(code, desc) {
  document.getElementById('htsInput').value = code;
  document.getElementById('htsDesc').textContent = desc;
  document.getElementById('htsDesc').classList.remove('hidden');
  document.getElementById('autocomplete').classList.add('hidden');
}

function calculate() {
  if (!D) { showMsg('数据还在加载中，请稍等'); return; }
  const h = document.getElementById('htsInput').value.trim();
  const v = document.getElementById('valueInput').value;
  document.getElementById('results').classList.add('hidden');
  document.getElementById('message').classList.add('hidden');
  if (!h) { showMsg('请输入 HTS 编码'); return; }
  if (!v || parseFloat(v) <= 0) { showMsg('请输入有效货值'); return; }
  const val = parseFloat(v);
  const [code, entry, cnRaw] = lookup(h, document.getElementById('htsInput').value.trim());
  if (!entry) { showMsg('未找到该 HTS 编码'); return; }
  render(calc(code, entry, val, currentMode), val, cnRaw && cnRaw !== code ? cnRaw : null, code);
}

function render(d, v, cnRaw, usCode) {
  const hint = document.getElementById('cnHint');
  if (cnRaw) {
    document.getElementById('cnHintCode').textContent = cnRaw;
    document.getElementById('cnHintUS').textContent = usCode;
    document.getElementById('cnHintDesc').textContent = d.desc || '';
    hint.classList.remove('hidden');
  } else { hint.classList.add('hidden'); }
  document.getElementById('r_hts').textContent = d.code;
  document.getElementById('r_desc').textContent = d.desc || '-';
  document.getElementById('r_value').textContent = '$' + v.toLocaleString('en-US', {minimumFractionDigits:2});
  document.getElementById('r_base').textContent = d.base_rate_type === 'specific' ? '从量税 → 需人工确认' : '$' + d.base_duty.toFixed(2) + ' (' + d.base_rate + '%)';
  if (d.s301_duty > 0 || d.s301_rate) {
    document.getElementById('r_301').textContent = '$' + d.s301_duty.toFixed(2) + ' (+' + d.s301_rate + '%) [' + (d.s301_code||'—') + ']';
    document.getElementById('row_301').classList.remove('hidden');
  } else document.getElementById('row_301').classList.add('hidden');
  document.getElementById('r_ieepa').textContent = '$' + d.ieepa_duty.toFixed(2);
  document.getElementById('r_mpf').textContent = '$' + d.mpf.toFixed(2);
  if (currentMode === 'ocean') {
    document.getElementById('r_hmf').textContent = '$' + d.hmf.toFixed(2);
    document.getElementById('row_hmf').classList.remove('hidden');
  } else document.getElementById('row_hmf').classList.add('hidden');
  document.getElementById('r_total').textContent = '$' + d.total.toFixed(2);
  document.getElementById('r_effective').textContent = ((d.total / v) * 100).toFixed(2) + '%';
  document.getElementById('results').classList.remove('hidden');
  document.getElementById('results').scrollIntoView({behavior:'smooth'});
}

function showMsg(msg) {
  const el = document.getElementById('message');
  el.textContent = msg;
  el.classList.remove('hidden');
}

// Boot
init();
</script>
</body>
</html>
